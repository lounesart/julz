# Drop-in for the system ollama.service (needs sudo, see systemd/README.md).
# Why: on 2026-10-16 julz-pro (9B, 6.4 GB) did not fit the 6 GB GPU, spilled ~4 GB into
# RAM next to Open WebUI and Firefox, no swap, and the global OOM took the desktop session.
[Service]
# Two models at most: julz and the bge-m3 embedder stay loaded together (3.9 + 1.2 GB), or
# every question about my notes reloads julz (26.5 s). A model that does not fit in VRAM
# beside another waits until an idle one unloads; julz-pro still loads alone (threat 144)
Environment="OLLAMA_MAX_LOADED_MODELS=2"
# One request at a time, so a single KV cache, not one per parallel slot
Environment="OLLAMA_NUM_PARALLEL=1"
# Keep 512 MiB of VRAM free for everything that is not ollama
Environment="OLLAMA_GPU_OVERHEAD=536870912"
# llama-server keeps saved prompts in host RAM, 8 GiB by default; one runner reached 9 GB on
# 24 Oct and froze the host. 1024 MiB still restores the chat after the retrieval rewrite (145)
Environment="LLAMA_ARG_CACHE_RAM=1024"
# RAM cap: past 6G the kernel reclaims ollama's pages, at 7G it kills the runner inside
# this cgroup only. Your session never becomes the OOM victim because of a model.
MemoryHigh=6G
MemoryMax=7G
# MemoryMax counts RAM only. Since zram (24 Oct) ollama could swap without limit around it (145)
MemorySwapMax=1G
# If the whole machine still runs out, kill ollama before anything else
OOMScoreAdjust=500
