<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Julz integrations</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/3de22ea2fad70720ead6040f5ee388e9">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tektur:wght@400;500;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="app" style="--k: {{k}}; font-family: 'Plus Jakarta Sans', sans-serif; color: #F5F2F4">
  <header class="win rowx g3 gut" style="padding-top: 24px; padding-bottom: 16px">
    <div class="stack g1 grow">
      <h1 class="m0 disp t-tl">Links</h1>
      <span class="t-sec muted">What Julz runs on its own · {{activeCount}} on</span>
    </div>
  </header>

  <main class="scroll gut stack g3" style="padding-bottom: 112px">
    <sc-for list="{{items}}" as="it" hint-placeholder-count="6">
      <div class="card win" style="animation-delay: {{it.delay}}; border-color: {{it.border}}; border-radius: 24px">
        <button class="press rowx g4" onClick="{{it.toggle}}" aria-expanded="{{it.open}}" style="width: 100%; min-height: 80px; padding: 16px 20px; border: 0; background: transparent; color: var(--text); text-align: left; cursor: pointer; font-family: 'Plus Jakarta Sans', sans-serif">
          <span class="ico" style="width: 48px; height: 48px; background: {{it.tint}}; color: #120A10">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.icon}}"></path></svg>
          </span>
          <span class="stack g1 grow">
            <span class="t-body b">{{it.name}}</span>
            <span class="t-sec muted">{{it.what}}</span>
          </span>
          <span class="rowx g2 t-cap b" style="flex: none; min-height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid {{it.pillLine}}; color: {{it.pill}}">
            <sc-if value="{{it.live}}" hint-placeholder-val="{{ false }}"><span class="pulse" style="width: 7px; height: 7px; border-radius: 4px; background: currentColor"></span></sc-if>
            {{it.status}}
          </span>
        </button>
        <sc-if value="{{it.open}}" hint-placeholder-val="{{ false }}">
          <div class="popin stack g2 t-sec" style="padding: 0 20px 20px 84px; color: #CFC8D0">
            <sc-for list="{{it.facts}}" as="fact" hint-placeholder-count="2"><span>· {{fact}}</span></sc-for>
          </div>
        </sc-if>
      </div>
    </sc-for>
    <div class="win rowx g4" style="animation-delay: 520ms; border-radius: 24px; border: 1px dashed #FFFFFF33; padding: 20px">
      <span class="ico" style="width: 48px; height: 48px; border: 1px dashed #FFFFFF55; color: var(--muted)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14 M5 12h14"></path></svg>
      </span>
      <span class="t-sec muted grow">New ones start as a threat row, then tests, then code. Here you watch them; you switch them on the laptop.</span>
    </div>
  </main>

  <nav class="tabbar" aria-label="Main">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
      <a class="tab press" href="{{t.href}}" aria-label="{{t.label}}" style="color: {{t.color}}">
        <span style="position: relative; display: flex">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>
          <sc-if value="{{t.badge}}" hint-placeholder-val="{{ false }}"><span class="badge">1</span></sc-if>
        </span>
        <span style="width: 5px; height: 5px; border-radius: 3px; background: {{t.dot}}"></span>
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"textScale":{"editor":"enum","options":["1","1.3","1.6","2"],"default":"1"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: 'keep' };
  }
  renderVals() {
    const S = {
      On: { pill: '#C4F07A', pillLine: '#C4F07A66', live: true },
      Gated: { pill: '#7FE3F0', pillLine: '#7FE3F066', live: false },
      Check: { pill: '#F7D58B', pillLine: '#F7D58B66', live: false },
      Planned: { pill: '#ABA4AC', pillLine: '#FFFFFF33', live: false }
    };
    const defs = [
      { id: 'keep', name: 'Keep sync', what: 'Notes kept from Claude reach Julz', status: 'On', tint: '#C9B8F0', icon: 'M4 4h12l4 4v12H4z M8 12h8 M8 16h5', facts: ['last sync 10:12, 14 notes', 'checks every 10 min', 'never touches your own notes'] },
      { id: 'delegate', name: 'Delegation', what: 'Claude Code runs a spec after your passkey', status: 'Gated', tint: '#7FE3F0', icon: 'M4 5h16v14H4z M8 10l3 2-3 2 M13 15h3', facts: ['2 runs this week', 'every run waits for the approver'] },
      { id: 'vault', name: 'Notes vault', what: 'Changes to your notes after your click', status: 'On', tint: '#C4F07A', icon: 'M5 4h11l3 3v13H5z M9 4v5h6V4', facts: ['6 commits today', 'one git commit per change'] },
      { id: 'push', name: 'Push server', what: 'ntfy on the laptop, tailnet only', status: 'On', tint: '#FF7AB6', icon: 'M6 8a6 6 0 0112 0c0 7 3 9 3 9H3s3-2 3-9 M10 21h4', facts: ['this phone only, by token', 'missed notices catch up on reconnect'] },
      { id: 'voice', name: 'Voice', what: 'Speech to text in the chat', status: 'Check', tint: '#F7D58B', icon: 'M12 3a3 3 0 013 3v6a3 3 0 01-6 0V6a3 3 0 013-3z M5 11a7 7 0 0014 0 M12 18v3', facts: ['open feedback: wrong language guesses'] },
      { id: 'ci', name: 'CI checks', what: 'Tests and gitleaks on every push', status: 'Planned', tint: '#3A343D', icon: 'M6 3v12 M6 15a3 3 0 100 6 3 3 0 000-6z M18 9a3 3 0 100-6 3 3 0 000 6z M18 9c0 5-6 4-12 6', facts: ['in PLAN.md, not started'] }
    ];
    const items = defs.map((d, i) => {
      const open = this.state.open === d.id;
      return { ...d, ...S[d.status], open, delay: (i * 70 + 80) + 'ms', border: open ? d.tint + '99' : '#FFFFFF14',
        toggle: () => this.setState({ open: open ? '' : d.id }) };
    });
    const tabs = [
      { label: 'Feed', href: 'Main.dc.html', icon: 'M4 4h7v7H4z M13 4h7v7h-7z M4 13h7v7H4z M13 13h7v7h-7z' },
      { label: 'Chat', href: '#chat', icon: 'M4 5h16v11H9l-5 4z' },
      { label: 'Approve', href: 'Approve.dc.html', badge: true, icon: 'M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6l7-3z M9 12l2 2 4-4' },
      { label: 'Links', href: 'Integrations.dc.html', on: true, icon: 'M8 3v5 M16 3v5 M6 8h12v4a6 6 0 01-12 0z M12 18v3' },
      { label: 'Setup', href: 'Settings.dc.html', icon: 'M12 15a3 3 0 100-6 3 3 0 000 6z M19 12a7 7 0 00-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 00-2-1.2L14 3h-4l-.5 2.6a7 7 0 00-2 1.2l-2.4-1-2 3.4 2 1.6a7 7 0 000 2.4l-2 1.6 2 3.4 2.4-1a7 7 0 002 1.2L10 21h4l.5-2.6a7 7 0 002-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z' }
    ].map((t) => ({ ...t, badge: !!t.badge, color: t.on ? '#F5F2F4' : '#7E777F', dot: t.on ? '#E3197A' : 'transparent' }));
    return { k: Number(this.props.textScale ?? 1) || 1, items, tabs, activeCount: defs.filter((d) => d.status === 'On').length };
  }
}
</script>
</body>
</html>
