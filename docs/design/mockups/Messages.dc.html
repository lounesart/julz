<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Julz feed, messages</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/3de22ea2fad70720ead6040f5ee388e9">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tektur:wght@400;500;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="app" style="--k: {{k}}; font-family: 'Plus Jakarta Sans', sans-serif; color: #F5F2F4">

  <header class="win rowx g3 gut" style="padding-top: 24px; padding-bottom: 16px">
    <div class="stack g1 grow">
      <h1 class="m0 disp t-tl">Julz</h1>
      <span class="mono t-cap muted">{{unreadLabel}}</span>
    </div>
    <button class="rbtn press" onClick="{{markAll}}" aria-label="Mark all read">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12l5 5L18 6 M10 15l2 2L22 7"></path></svg>
    </button>
  </header>

  <nav class="gut win" aria-label="Feed views" style="animation-delay: 60ms; padding-bottom: 12px">
    <div class="seg">
      <a href="Main.dc.html">Now</a>
      <a class="on" href="Messages.dc.html" aria-current="page">Messages</a>
      <a href="History.dc.html">History</a>
    </div>
  </nav>

  <div class="rowx g2 win" style="animation-delay: 100ms; overflow-x: auto; padding: 0 var(--gutter) 12px; flex: none">
    <sc-for list="{{chips}}" as="c" hint-placeholder-count="6">
      <button class="{{c.cls}}" onClick="{{c.pick}}" aria-pressed="{{c.on}}">{{c.label}}</button>
    </sc-for>
  </div>

  <main class="scroll gut stack g6" style="padding-top: 4px; padding-bottom: 112px">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
      <section class="stack g2">
        <h2 class="sect">{{g.name}}</h2>
        <sc-for list="{{g.rows}}" as="m" hint-placeholder-count="3">
          <div class="win" style="animation-delay: {{m.delay}}">
            <sc-if value="{{m.isMarker}}" hint-placeholder-val="{{ false }}">
              <div class="rowx g3" style="min-height: 48px">
                <span style="flex: 1; height: 1px; background: var(--line)"></span>
                <span class="mono t-cap muted">{{m.title}}</span>
                <span style="flex: 1; height: 1px; background: var(--line)"></span>
              </div>
            </sc-if>
            <sc-if value="{{m.isRow}}" hint-placeholder-val="{{ true }}">
             <div style="position: relative; overflow: hidden; border-radius: var(--r-m); border: 1px solid {{m.border}}; background: #FFFFFF0A; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); transition: border-color .3s">
              <sc-if value="{{m.swipedNow}}" hint-placeholder-val="{{ false }}">
              <div style="position: absolute; inset: 0 0 0 auto; width: 72px; display: flex; align-items: stretch; justify-content: flex-end">
                <button onClick="{{m.markRead}}" aria-label="Mark read" style="width: 72px; border: 0; background: #C4F07A; color: #120A10; font: 700 var(--t-cap) 'Plus Jakarta Sans', sans-serif; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L19 7"></path></svg>
                  Read
                </button>
              </div>
              </sc-if>
              <a class="rowx g4" href="Notice.dc.html" style="position: relative; min-height: var(--row); padding: var(--sp3) var(--sp4); background: transparent; text-decoration: none; color: var(--text); margin-right: {{m.inset}}; transition: margin-right .45s var(--ease)">
                <span class="ico" style="background: {{m.tint}}; color: #120A10">
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{m.icon}}"></path></svg>
                </span>
                <span class="stack g1 grow">
                  <span class="rowx g2" style="align-items: baseline">
                    <span class="t-body grow" style="font-weight: {{m.weight}}">{{m.title}}</span>
                    <span class="mono t-cap muted">{{m.time}}</span>
                  </span>
                  <span class="rowx g2">
                    <span class="t-sec muted grow">{{m.sub}}</span>
                    <span class="dot" style="background: {{m.dot}}"></span>
                  </span>
                </span>
              </a>
             </div>
            </sc-if>
          </div>
        </sc-for>
      </section>
    </sc-for>
    <sc-if value="{{isEmpty}}" hint-placeholder-val="{{ false }}">
      <p class="t-body muted" style="text-align: center; margin: 48px 32px">Nothing in this channel.</p>
    </sc-if>
  </main>

  <nav class="tabbar" aria-label="Main">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
      <a class="tab press" href="{{t.href}}" aria-label="{{t.label}}" style="color: {{t.color}}">
        <span style="position: relative; display: flex">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>
          <sc-if value="{{t.badge}}" hint-placeholder-val="{{ false }}"><span class="badge">1</span></sc-if>
        </span>
        <span style="width: 5px; height: 5px; border-radius: 3px; background: {{t.dot}}"></span>
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"textScale":{"editor":"enum","options":["1","1.3","1.6","2"],"default":"1"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'all', read: {}, swiped: 'a1' };
  }
  renderVals() {
    const k = Number(this.props.textScale ?? 1) || 1;
    const st = this.state;
    const K = {
      approval: { tint: '#FF7AB6', icon: 'M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6l7-3z' },
      todo: { tint: '#F7D58B', icon: 'M4 6h2 M4 12h2 M4 18h2 M9 6h11 M9 12h11 M9 18h7' },
      inbox: { tint: '#C9B8F0', icon: 'M4 13l2-8h12l2 8 M4 13v6h16v-6 M4 13h5l1 2h4l1-2h5' },
      run: { tint: '#7FE3F0', icon: 'M4 5h16v14H4z M8 10l3 2-3 2 M13 15h3' },
      review: { tint: '#C4F07A', icon: 'M12 21a9 9 0 100-18 9 9 0 000 18z M12 7v5l3 2' },
      change: { tint: '#B9B2BA', icon: 'M3 7h6l2 2h10v10H3z M10 14h6 M14 12l2 2-2 2' },
      warning: { tint: '#FF8F80', icon: 'M12 4l9 16H3z M12 10v4 M12 17h.01' }
    };
    const all = [
      { id: 'a1', day: 'Today', kind: 'approval', title: 'Approve: rename dhcp notes', sub: 'Waits for your passkey', time: '14:32', unread: true },
      { id: 't1', day: 'Today', kind: 'todo', title: 'physio: 1 task left', sub: 'Review session notes', time: '14:10', unread: true },
      { id: 'r1', day: 'Today', kind: 'run', title: 'Run done: nmap lesson summary', sub: 'Report is in Outbox', time: '13:05', unread: true },
      { id: 'i1', day: 'Today', kind: 'inbox', title: '2 new drafts in Inbox', sub: 'Julz wrote them', time: '11:20', unread: false },
      { id: 'mk', day: 'Today', marker: true, title: '2 caught up after reconnect · 09:02' },
      { id: 'c1', day: 'Today', kind: 'change', title: 'physio.md moved to daily/done', sub: 'Every task ticked', time: '08:41', unread: false },
      { id: 'c2', day: 'Today', kind: 'change', title: 'Feedback solved', sub: 'Answers too long', time: '08:15', unread: false },
      { id: 'v1', day: 'Yesterday', kind: 'review', title: '3 notes due for review', sub: 'DHCP · OSI model · ACLs', time: '19:00', unread: false },
      { id: 'w1', day: 'Yesterday', kind: 'warning', title: 'Vault commit blocked', sub: 'Check git status on the laptop', time: '16:22', unread: false }
    ];
    const f = st.filter;
    const shown = all.filter((m) => m.marker ? f === 'all' : (f === 'all' || m.kind === f));
    let i = 0;
    const rows = shown.map((m) => {
      i += 1;
      if (m.marker) return { ...m, isMarker: true, isRow: false, delay: (120 + i * 50) + 'ms' };
      const unread = m.unread && !st.read[m.id] && !st.read.all;
      return { ...m, ...K[m.kind], isMarker: false, isRow: true, weight: unread ? 700 : 500,
        dot: unread ? '#E3197A' : 'transparent', delay: (120 + i * 50) + 'ms', border: unread ? '#E3197A66' : '#FFFFFF1A',
        inset: st.swiped === m.id && unread ? '72px' : '0px', swipedNow: st.swiped === m.id && unread,
        markRead: () => this.setState({ read: { ...st.read, [m.id]: true }, swiped: '' }) };
    });
    const groups = ['Today', 'Yesterday'].map((name) => ({ name, rows: rows.filter((r) => r.day === name) })).filter((g) => g.rows.length);
    const defs = [['all', 'All'], ['approval', 'Approvals'], ['todo', 'Todos'], ['inbox', 'Inbox'], ['run', 'Runs'], ['review', 'Review'], ['change', 'Changes'], ['warning', 'Warnings']];
    const chips = defs.map(([id, label]) => ({ label, on: f === id, cls: f === id ? 'chip on press' : 'chip press',
      pick: () => this.setState({ filter: id }) }));
    const unread = all.filter((m) => m.unread && !st.read[m.id] && !st.read.all).length;
    const tabs = [
      { label: 'Feed', href: 'Main.dc.html', on: true, icon: 'M4 4h7v7H4z M13 4h7v7h-7z M4 13h7v7H4z M13 13h7v7h-7z' },
      { label: 'Chat', href: '#chat', icon: 'M4 5h16v11H9l-5 4z' },
      { label: 'Approve', href: 'Approve.dc.html', badge: true, icon: 'M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6l7-3z M9 12l2 2 4-4' },
      { label: 'Links', href: 'Integrations.dc.html', icon: 'M8 3v5 M16 3v5 M6 8h12v4a6 6 0 01-12 0z M12 18v3' },
      { label: 'Setup', href: 'Settings.dc.html', icon: 'M12 15a3 3 0 100-6 3 3 0 000 6z M19 12a7 7 0 00-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 00-2-1.2L14 3h-4l-.5 2.6a7 7 0 00-2 1.2l-2.4-1-2 3.4 2 1.6a7 7 0 000 2.4l-2 1.6 2 3.4 2.4-1a7 7 0 002 1.2L10 21h4l.5-2.6a7 7 0 002-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z' }
    ].map((t) => ({ ...t, badge: !!t.badge, color: t.on ? '#F5F2F4' : '#7E777F', dot: t.on ? '#E3197A' : 'transparent' }));
    return {
      k, chips, groups, tabs, isEmpty: groups.length === 0,
      unreadLabel: unread ? unread + ' unread · swipe left to mark read' : 'all read',
      markAll: () => this.setState({ read: { ...st.read, all: true }, swiped: '' })
    };
  }
}
</script>
</body>
</html>
